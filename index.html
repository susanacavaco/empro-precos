<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMPRO — Gestão de Preços 2026</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f6f6f7;color:#1a1a2e;font-size:13px}
.app{display:flex;min-height:100vh}
.sb{width:190px;background:#0F1B2D;display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;height:100vh;z-index:10}
.main{margin-left:190px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.logo{padding:14px 14px 12px;border-bottom:1px solid #1e3050}
.logo-t{color:#F59E0B;font-weight:700;font-size:15px}
.logo-s{color:#4a6080;font-size:10px;margin-top:2px}
.ns{color:#4a6080;font-size:9px;font-weight:700;letter-spacing:1px;padding:12px 14px 4px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;color:#8899aa;border-left:3px solid transparent;font-size:12px}
.ni:hover{color:#F59E0B}
.ni.on{color:#F59E0B;background:rgba(245,158,11,0.08);border-left-color:#F59E0B;font-weight:600}

/* Top bar */
.topbar{background:#fff;border-bottom:1px solid #e1e3e5;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.topbar-title{font-size:14px;font-weight:600;color:#1a1a2e;margin-right:8px}
.topbar-count{font-size:12px;color:#6b7280;background:#f3f4f6;padding:3px 8px;border-radius:4px}

/* Spreadsheet */
.sheet-wrap{overflow:auto;flex:1}
.sheet{border-collapse:collapse;width:max-content;min-width:100%}
.sheet thead tr{background:#f6f6f7;position:sticky;top:0;z-index:4}
.sheet th{padding:8px 10px;text-align:left;font-size:11px;font-weight:600;color:#6b7280;border-right:1px solid #e1e3e5;border-bottom:2px solid #c9cccf;white-space:nowrap;user-select:none}
.sheet th:first-child{border-left:none}
.sheet td{padding:0;border-right:1px solid #e1e3e5;border-bottom:1px solid #e1e3e5;background:#fff;vertical-align:middle;position:relative}
.sheet td:first-child{border-left:none}
.sheet tr:hover td{background:#f9fafb}
.sheet tr.aR td{background:#fff5f5}
.sheet tr.aR:hover td{background:#fee2e2}

/* Cell content */
.cell{padding:7px 10px;display:block;font-size:12px;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;min-height:34px;line-height:20px}
.cell.num{text-align:right;font-variant-numeric:tabular-nums}
.cell.code{font-family:monospace;font-size:10px;color:#6b7280}
.cell.bold{font-weight:600}
.cell.purple{color:#7c3aed;font-weight:600}

/* Editable cell */
.cell-edit{background:transparent;border:none;outline:none;width:100%;font-family:inherit;font-size:12px;color:#1a1a2e;padding:7px 10px;text-align:right;display:block;min-height:34px}
td.editing{outline:2px solid #F59E0B;outline-offset:-1px;background:#fffbeb!important;z-index:3}
td.editing:hover{background:#fffbeb!important}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}
.badge-G{background:#e3f1df;color:#1e7e34}
.badge-R{background:#fce8e8;color:#c0392b}
.badge-A{background:#fef9e7;color:#b7770d}

/* Filters bar */
.fbar{background:#fff;border-bottom:1px solid #e1e3e5;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=password],select{border:1px solid #c9cccf;border-radius:6px;padding:5px 9px;font-size:12px;background:#fff;color:#1a1a2e;outline:none;font-family:inherit;height:32px}
input[type=text]:focus,select:focus{border-color:#F59E0B;box-shadow:0 0 0 2px rgba(245,158,11,0.15)}
.btn{border:1px solid #c9cccf;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;background:#fff;color:#374151;font-family:inherit;height:32px;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:#f3f4f6}
.bp{background:#F59E0B;border-color:#F59E0B;color:#0F1B2D;font-weight:600}
.bp:hover{background:#e8930a}
.bd{background:#DC2626;border-color:#DC2626;color:#fff}

/* Stats row */
.stats{display:flex;gap:1px;background:#e1e3e5;border-bottom:2px solid #c9cccf}
.stat-cell{background:#f6f6f7;padding:8px 16px;flex:1;min-width:120px}
.stat-val{font-size:18px;font-weight:700;line-height:1}
.stat-lbl{font-size:10px;color:#6b7280;margin-top:2px}

/* Card */
.card{background:#fff;border-radius:8px;padding:18px;margin:16px;border:1px solid #e1e3e5}

/* Login */
.lw{min-height:100vh;background:#0F1B2D;display:flex;align-items:center;justify-content:center}
.rb{background:#1a2d45;border:1px solid #1e3a54;border-radius:8px;padding:12px 16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;width:100%;margin-bottom:9px;font-family:inherit}
.rb:hover{border-color:#F59E0B}
.uz{border:2px dashed #c9cccf;border-radius:8px;padding:28px;text-align:center;cursor:pointer}
.uz:hover{border-color:#F59E0B;background:#fffbeb}

/* Drag handle — Excel fill handle style */
.dh{width:8px;height:8px;background:#1a1a2e;border:1px solid #fff;position:absolute;right:-1px;bottom:-1px;cursor:crosshair;display:none;z-index:10;border-radius:0}
td:hover .dh{display:block}
.dh:hover{background:#F59E0B}
.drag-target td{background:#fffbeb!important;outline:2px solid #F59E0B}
.drag-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;cursor:ns-resize}

/* Vbar vendor */
.vbar{background:#0F1B2D;padding:10px 18px;display:flex;align-items:center;justify-content:space-between}
@media print{.np{display:none!important}.vbar{position:static}}

/* Progress */
.prog-wrap{display:none;margin-top:12px}
.prog-bar{height:5px;background:#e1e3e5;border-radius:3px}
.prog-fill{height:5px;background:#F59E0B;border-radius:3px;width:0%;transition:width 0.3s}

/* Frozen col */
.sheet td:nth-child(1),.sheet th:nth-child(1){position:sticky;left:0;z-index:2;background:#fff}
.sheet thead th:nth-child(1){z-index:5;background:#f6f6f7}
.sheet tr:hover td:nth-child(1){background:#f9fafb}
.sheet tr.aR td:nth-child(1){background:#fff5f5}
</style>
</head>

function colsTable(){
  var rows=[["A","Artigo","Código","est"],["B","Descrição","Nome do artigo","est"],["C","Fornecedor","Filtro","est"],["D/E","Família/Subfamília","Família","est"],["F","Cód. Barras","EAN","est"],["G","Marca","Filtro","est"],["H","Modelo","Filtro","est"],["I","Últ. Preço Compra","Preço compra","prim"],["K","Preço Acordado","Fornecedor","man"],["L","Markup","Markup % Conf.","edit"],["S","Markup5","Markup % Garrafeira","edit"],["T","IVA","Taxa IVA","est"],["Y","ERP PVP1","Referência","ref"]];

function handlePrim(input){
  if(!input.files[0])return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:"binary"});
      var data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      var ns={};S.arts.forEach(function(a){ns[a.a]=a.pc});S.sn=ns;
      var upd=0;
      data.forEach(function(row){
        var keys=Object.keys(row);
        var aK=keys.filter(function(k){return/artigo|codigo|código/i.test(k)})[0];
        var pK=keys.filter(function(k){return/compra|preço|preco/i.test(k)})[0];
        if(aK&&pK){var av=String(row[aK]).padStart(8,"0");var pv=parseFloat(String(row[pK]).replace(",","."));var found=S.arts.filter(function(a){return a.a===av})[0];if(found&&pv>0){found.pc=Math.round(pv*10000)/10000;upd++}}
      });
      alert("✅ Snapshot guardado!\n"+Object.keys(ns).length+" artigos.\n"+upd+" preços actualizados.");
      S.tab="conf";re();
    }catch(err){alert("Erro: "+err.message)}
  };reader.readAsBinaryString(input.files[0]);
}

// ── FORNECEDOR ─────────────────────────────────────────────
function fornHTML(){
  if(S.fornOk)return'<div class="card" style="margin:16px;background:#F0FDF4;border-color:#86EFAC"><div style="font-weight:700;color:#16A34A;font-size:14px">✅ Preços acordados aplicados!</div><div style="font-size:12px;color:#15803D;margin-top:4px">PVPs recalculados.</div><button class="btn bp" onclick="S.fornOk=false;S.matchData=null;S.fornH=[];S.fornRaw=null;re()" style="margin-top:12px">Nova importação</button></div>';
  if(S.matchData)return matchHTML();
  if(S.fornH.length>0)return colPickHTML();
  return'<div class="card" style="margin:16px"><div style="font-weight:600;font-size:14px;margin-bottom:6px">📤 Tabela de preços do fornecedor</div><div style="font-size:12px;color:#6b7280;margin-bottom:16px">Cruzamos por código de barras e depois por designação.</div><div class="uz" onclick="document.getElementById(\'ff\').click()"><div style="font-size:28px;margin-bottom:8px">📂</div><div style="font-size:13px;font-weight:600">Upload tabela do fornecedor (.xlsx)</div><input type="file" id="ff" accept=".xlsx,.xls" style="display:none" onchange="handleForn(this)"></div></div>';
}
function colPickHTML(){
  var fields=[["Cód. Barras","fColB","Opcional"],["Designação","fColD","Nome do artigo"],["Preço","fColP","Novo preço"]];
  return'<div class="card" style="margin:16px"><div style="font-weight:600;font-size:14px;margin-bottom:14px">Identifica as colunas</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px">'+fields.map(function(x){return'<div><div style="font-size:11px;font-weight:600;margin-bottom:5px">'+x[0]+'</div><select onchange="S.'+x[1]+'=this.value;re()" style="width:100%"><option value="">— Seleccionar —</option>'+S.fornH.map(function(h){return'<option'+(S[x[1]]===h?" selected":"")+'>'+esc(h)+'</option>'}).join("")+'</select><div style="font-size:10px;color:#9ca3af;margin-top:3px">'+x[2]+'</div></div>'}).join("")+'</div><button class="btn bp" '+(!S.fColP||!S.fColD?"disabled":"")+'onclick="doMatch()">🔍 Cruzar com artigos EMPRO</button></div>';
}
function matchHTML(){
  var m=S.matchData,u=S.unmatch;
  return'<div class="card" style="margin:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><div style="font-weight:700;font-size:14px">✅ '+m.length+' artigos identificados</div><div style="font-size:11px;color:#6b7280">Desmarca os que não queres aplicar</div></div><button class="btn bp" onclick="applyPrices()">Aplicar preços</button></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:#f6f6f7"><th style="padding:7px 10px;border-bottom:2px solid #e1e3e5">Incl.</th><th style="padding:7px 10px;border-bottom:2px solid #e1e3e5">Artigo</th><th style="padding:7px 10px;border-bottom:2px solid #e1e3e5">Descrição EMPRO</th><th style="padding:7px 10px;border-bottom:2px solid #e1e3e5">Designação Fornecedor</th><th style="padding:7px 10px;border-bottom:2px solid #e1e3e5">Actual</th><th style="padding:7px 10px;border-bottom:2px solid #e1e3e5">Novo</th><th style="padding:7px 10px;border-bottom:2px solid #e1e3e5">Δ</th></tr></thead><tbody>'+m.map(function(r,i){var d=((r.pN-r.pA)/r.pA*100);return'<tr style="opacity:'+(r.inc?1:0.4)+'"><td style="padding:6px 10px;border-bottom:1px solid #f1f3f6"><input type="checkbox"'+(r.inc?" checked":"")+" onchange=\"toggleM("+i+")\"></td><td style='padding:6px 10px;border-bottom:1px solid #f1f3f6;font-family:monospace;font-size:10px'>"+r.art+"</td><td style='padding:6px 10px;border-bottom:1px solid #f1f3f6'>"+esc(r.desc)+"</td><td style='padding:6px 10px;border-bottom:1px solid #f1f3f6;color:#6b7280'>"+esc(r.fd)+"</td><td style='padding:6px 10px;border-bottom:1px solid #f1f3f6'>"+eu(r.pA)+"</td><td style='padding:6px 10px;border-bottom:1px solid #f1f3f6;font-weight:600'>"+eu(r.pN)+'</td><td style="padding:6px 10px;border-bottom:1px solid #f1f3f6"><span class="badge '+(d>0?"badge-R":"badge-G")+'">'+(d>0?"▲":"▼")+Math.abs(d).toFixed(1)+'%</span></td></tr>'}).join("")+'</tbody></table></div></div>'+(u.length>0?'<div class="card" style="margin:0 16px 16px"><div style="font-weight:600;font-size:12px;color:#D97706;margin-bottom:10px">⚠️ '+u.length+' não identificados</div><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr style="background:#f6f6f7"><th style="padding:7px 10px;border-bottom:2px solid #e1e3e5">Designação</th><th style="padding:7px 10px;border-bottom:2px solid #e1e3e5">Cód. Barras</th><th style="padding:7px 10px;border-bottom:2px solid #e1e3e5">Preço</th></tr></thead><tbody>'+u.map(function(r){return'<tr><td style="padding:6px 10px;border-bottom:1px solid #f1f3f6">'+esc(r.d)+'</td><td style="padding:6px 10px;border-bottom:1px solid #f1f3f6;font-family:monospace;font-size:10px">'+(r.b||"—")+'</td><td style="padding:6px 10px;border-bottom:1px solid #f1f3f6">'+eu(r.p)+'</td></tr>'}).join("")+'</tbody></table></div>':"");
}
function handleForn(input){
  if(!input.files[0])return;
  var reader=new FileReader();
  reader.onload=function(e){var wb=XLSX.read(e.target.result,{type:"binary"});var data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});if(data.length>0){S.fornH=Object.keys(data[0]);S.fornRaw=data}re()};
  reader.readAsBinaryString(input.files[0]);
}
function doMatch(){
  var matched=[],unm=[];
  S.fornRaw.forEach(function(row){var b=String(row[S.fColB]||"").trim();var d=String(row[S.fColD]||"").toLowerCase().trim();var p=parseFloat(String(row[S.fColP]).replace(",","."))||0;if(!p)return;var found=b?S.arts.filter(function(a){return a.cb===b})[0]:null;if(!found&&d)found=S.arts.filter(function(a){return a.d.toLowerCase().indexOf(d.slice(0,15))>=0||d.indexOf(a.d.toLowerCase().slice(0,15))>=0})[0];if(found)matched.push({art:found.a,desc:found.d,fd:row[S.fColD]||"",pN:p,pA:found.pc,inc:true});else unm.push({d:row[S.fColD]||"",b:b,p:p})});
  S.matchData=matched;S.unmatch=unm;re();
}
function toggleM(i){S.matchData[i].inc=!S.matchData[i].inc;re()}
function applyPrices(){S.matchData.filter(function(m){return m.inc}).forEach(function(m){var a=S.arts.filter(function(x){return x.a===m.art})[0];if(a)a.pa=m.pN});S.fornOk=true;re()}

// ── VENDEDOR ───────────────────────────────────────────────
function vHTML(){
  var arts=S.arts.filter(function(a){return a.pc>0});
  var forns=srtL(arts.map(function(a){return a.f}),"Todos");
  var fA=S.vF==="Todos"?arts:arts.filter(function(a){return a.f===S.vF});
  var marcas=srtL(fA.map(function(a){return a.ma}),"Todas");
  var fB=S.vMa==="Todas"?fA:fA.filter(function(a){return a.ma===S.vMa});
  var modelos=srtL(fB.filter(function(a){return a.mo}).map(function(a){return a.mo}),"Todos");
  var rows=fB.filter(function(a){return(!S.srch||a.d.toLowerCase().indexOf(S.srch.toLowerCase())>=0||a.ma.toLowerCase().indexOf(S.srch.toLowerCase())>=0)&&(S.vMo==="Todos"||a.mo===S.vMo)});
  var trs=rows.map(function(a){var p=pvpC(a.pc,a.pa,a.mk);return'<tr><td style="padding:6px 10px;border-bottom:1px solid #e1e3e5;font-family:monospace;font-size:10px;color:#6b7280">'+a.a+'</td><td style="padding:6px 10px;border-bottom:1px solid #e1e3e5;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(a.d)+'</td><td style="padding:6px 10px;border-bottom:1px solid #e1e3e5">'+esc(a.ma||"—")+'</td><td style="padding:6px 10px;border-bottom:1px solid #e1e3e5;color:#6b7280">'+esc(a.mo||"—")+'</td><td style="padding:6px 10px;border-bottom:1px solid #e1e3e5;text-align:right;font-weight:600">'+eu(p)+'</td>'+(S.vH?'<td style="padding:6px 10px;border-bottom:1px solid #e1e3e5;text-align:right">'+eu(phC(p))+'</td>':"")+(S.vG?'<td style="padding:6px 10px;border-bottom:1px solid #e1e3e5;text-align:right">'+eu(pgC(p))+'</td>':"")+'</tr>'}).join("");
  return'<div class="vbar np"><div style="color:#F59E0B;font-weight:700;font-size:17px">EMPRO <span style="color:#4a6080;font-weight:400;font-size:12px">· Tabela de Preços 2026</span></div><div style="display:flex;gap:8px"><button class="btn bp" onclick="window.print()">🖨️ PDF</button><button class="btn" onclick="S.role=\'admin\';S.srch=\'\';re()" style="background:#1a2d45;border-color:#1e3050;color:#8899aa">← Admin</button><button class="btn" onclick="S.role=null;S.step=null;re()" style="background:#1a2d45;border-color:#1e3050;color:#8899aa">Sair</button></div></div><div style="padding:14px 16px;background:#fff;border-bottom:1px solid #e1e3e5;display:flex;gap:8px;flex-wrap:wrap;align-items:center" class="np"><input type="text" placeholder="🔍 Pesquisar..." value="'+esc(S.srch)+'" oninput="S.srch=this.value;re()" style="width:200px"><select onchange="S.vF=this.value;S.vMa=\'Todas\';S.vMo=\'Todos\';re()" style="max-width:170px">'+selO(forns,S.vF)+'</select><select onchange="S.vMa=this.value;S.vMo=\'Todos\';re()" style="max-width:140px">'+selO(marcas,S.vMa)+'</select>'+(modelos.length>1?'<select onchange="S.vMo=this.value;re()" style="max-width:130px">'+selO(modelos,S.vMo)+'</select>':'')+'<div style="display:flex;gap:12px;margin-left:auto"><label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer"><input type="checkbox"'+(S.vH?" checked":"")+'onchange="S.vH=!S.vH;re()"> Horeca</label><label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer"><input type="checkbox"'+(S.vG?" checked":"")+'onchange="S.vG=!S.vG;re()"> Garrafeira</label></div></div><div style="overflow-auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead style="background:#f6f6f7;position:sticky;top:0"><tr><th style="padding:8px 10px;text-align:left;border-bottom:2px solid #c9cccf">Artigo</th><th style="padding:8px 10px;text-align:left;border-bottom:2px solid #c9cccf">Descrição</th><th style="padding:8px 10px;text-align:left;border-bottom:2px solid #c9cccf">Marca</th><th style="padding:8px 10px;text-align:left;border-bottom:2px solid #c9cccf">Modelo</th><th style="padding:8px 10px;text-align:right;border-bottom:2px solid #c9cccf">PVP</th>'+(S.vH?'<th style="padding:8px 10px;text-align:right;border-bottom:2px solid #c9cccf">Horeca</th>':"")+(S.vG?'<th style="padding:8px 10px;text-align:right;border-bottom:2px solid #c9cccf">Garrafeira</th>':"")+'</tr></thead><tbody>'+trs+'</tbody></table><div style="padding:10px 14px;font-size:11px;color:#6b7280;border-top:1px solid #e1e3e5">'+rows.length+' artigos · Preços com IVA · 2026</div></div>';
}

// ── DRAG TO FILL ───────────────────────────────────────────
var drag={on:false,type:"",art:"",val:0};
document.addEventListener("mousedown",function(e){
  var h=e.target.closest?e.target.closest(".dh"):null;if(!h)return;
  e.preventDefault();
  var row=h.closest("tr");if(!row)return;
  drag.type=h.getAttribute("data-type")||"mk";
  drag.art=row.getAttribute("data-art")||row.getAttribute("data-art-g")||"";
  var a=S.arts.filter(function(x){return x.a===drag.art})[0];if(!a)return;
  drag.val=mkP(drag.type==="mk5"?(a.mk5||0):a.mk);
  drag.on=true;
  var ov=document.getElementById("dov");if(!ov){ov=document.createElement("div");ov.id="dov";ov.className="drag-overlay";document.body.appendChild(ov)}
  ov.style.display="block";
});
document.addEventListener("mousemove",function(e){
  if(!drag.on)return;
  var attr=drag.type==="mk5"?"data-art-g":"data-art";
  var rows=Array.from(document.querySelectorAll("tr["+attr+"]"));
  var si=-1,ci=-1;
  rows.forEach(function(r,i){if(r.getAttribute(attr)===drag.art)si=i;var rc=r.getBoundingClientRect();if(e.clientY>=rc.top&&e.clientY<=rc.bottom)ci=i});
  rows.forEach(function(r){r.classList.remove("drag-target")});
  if(si<0||ci<0)return;
  for(var i=Math.min(si,ci);i<=Math.max(si,ci);i++){if(i!==si)rows[i].classList.add("drag-target")}
});
document.addEventListener("mouseup",function(e){
  if(!drag.on)return;drag.on=false;
  var ov=document.getElementById("dov");if(ov)ov.style.display="none";
  var attr=drag.type==="mk5"?"data-art-g":"data-art";
  var changed=false;
  document.querySelectorAll("tr["+attr+"].drag-target").forEach(function(r){
    var artigo=r.getAttribute(attr);
    var a=S.arts.filter(function(x){return x.a===artigo})[0];
    if(a){var mv=Math.round(drag.val/100*10000)/10000;if(drag.type==="mk5")a.mk5=mv;else a.mk=mv;changed=true}
    r.classList.remove("drag-target");
  });
  if(changed)re();
});

re();
</script>
