// ── Cálculos ──
function pvp(c,a,m){ var b=a>0?a:c; if(!b||!m)return 0; return Math.round(b*(1+m)*1.175*100)/100; }
function mg(p,c){ return p>0?(p-c)/p:0; }
function pvpH(p){ return Math.round(p*0.85*100)/100; }
function pvpG(p){ return Math.round(p*0.80*100)/100; }
function pvpGarraf(a){
  var base=a.pa>0?a.pa:a.pc;
  if(!base)return 0;
  var mk=a.mk5||0;
  if(!mk) return pvpG(pvp(a.pc,a.pa,a.mk));
  var raw=base*(1+mk)*(1+a.iv/100);
  return Math.floor(raw*10)/10+0.09;
}
function mgGarraf(a){ var p=pvpGarraf(a); var b=a.pa>0?a.pa:a.pc; return p>0&&b>0?(p-b)/p:0; }
function pct(v){ return (v*100).toFixed(1)+"%"; }
function mkPct(v){ return Math.round(v*1000)/10; }
function eu(v){ return v>0?"€"+v.toFixed(2):"—"; }

// ── Filtros helper ──
function makeForns(list){
  var r=["Todos"];
  list.forEach(function(a){ if(a.f&&r.indexOf(a.f)<0)r.push(a.f); });
  r.sort(function(a,b){ return a==="Todos"?-1:b==="Todos"?1:a.localeCompare(b); });
  return r;
}
function makeMarcas(list,forn){
  var fl=forn==="Todos"?list:list.filter(function(a){return a.f===forn;});
  var r=["Todas"];
  fl.forEach(function(a){ if(a.ma&&r.indexOf(a.ma)<0)r.push(a.ma); });
  r.sort(function(a,b){ return a==="Todas"?-1:b==="Todas"?1:a.localeCompare(b); });
  return r;
}
function makeModelos(list,forn,marca){
  var fl=list;
  if(forn!=="Todos")fl=fl.filter(function(a){return a.f===forn;});
  if(marca!=="Todas")fl=fl.filter(function(a){return a.ma===marca;});
  var r=["Todos"];
  fl.forEach(function(a){ if(a.mo&&r.indexOf(a.mo)<0)r.push(a.mo); });
  r.sort(function(a,b){ return a==="Todos"?-1:b==="Todos"?1:a.localeCompare(b); });
  return r;
}
function sel(arr,val,onch){
  return '<select onchange="'+onch+'" style="max-width:170px">'+
    arr.map(function(v){return '<option'+(val===v?" selected":"")+'>'+v+'</option>';}).join("")+'</select>';
}

}

function setP(p,m){
  var w=document.getElementById("pWrap"),b=document.getElementById("pBar"),msg=document.getElementById("pMsg");
  if(w)w.style.display="block"; if(b)b.style.width=p+"%"; if(msg)msg.textContent=m;

function doImport(input){
  if(!input.files[0])return;
  setP(10,"A ler o ficheiro...");
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      setP(30,"A processar Excel...");
      var wb=XLSX.read(e.target.result,{type:"binary"});
      var sn=null;
      wb.SheetNames.forEach(function(s){ if(!sn&&/c.lculo|pvp|preço|tabela/i.test(s))sn=s; });
      if(!sn)sn=wb.SheetNames[0];
      setP(50,"A ler: "+sn);
      var ws=wb.Sheets[sn];
      var raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      var ds=0;
      for(var i=0;i<Math.min(10,raw.length);i++){
        if(String(raw[i][0]||"").toLowerCase()==="artigo"){ds=i+1;break;}
        if(String(raw[i][0]||"").match(/^\d{6,}/)){ds=i;break;}
      }
      setP(70,"A importar artigos...");
      var arts=[];
      for(var i=ds;i<raw.length;i++){
        var r=raw[i];
        if(!r[0]||String(r[0]).trim()==="")continue;
        var n=Number(r[0]);
        if(isNaN(n)||n<=0)continue;
        arts.push({
          a:String(n).padStart(8,"0"),
          d:String(r[1]||"").trim(),f:String(r[2]||"").trim(),
          fa:String(r[3]||"").trim(),sub:String(r[4]||"").trim(),
          cb:String(r[5]||"").trim(),ma:String(r[6]||"").trim(),mo:String(r[7]||"").trim(),
          pc:nv(r[8]),pa:nv(r[10]),mk:nv(r[11]),
          mk5:nv(r[18]),iv:nv(r[19])||23,p1:nv(r[24]),p5:nv(r[25])
        });
      }
      setP(95,"A finalizar...");
      if(arts.length===0){alert("Nenhum artigo encontrado. Verifica se é o ficheiro correcto.");return;}
      S.arts=arts; S.isDemo=false; S.sn={};
      S.importLog="Sheet: \""+sn+"\" · "+arts.length+" artigos · "+arts.filter(function(a){return a.pc>0;}).length+" com preço";
      setTimeout(function(){ S.tab="conf"; re(); },400);
    }catch(err){ alert("Erro: "+err.message); }
  };
  reader.readAsBinaryString(input.files[0]);
}

function doPrim(input){
  if(!input.files[0])return;

  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:"binary"});

      var updated=0;
      data.forEach(function(row){
        var keys=Object.keys(row);
        var aK=keys.filter(function(k){return /artigo|codigo|código/i.test(k);})[0];
        var pK=keys.filter(function(k){return /compra|preço|preco/i.test(k);})[0];
        if(aK&&pK){
          var av=String(row[aK]).padStart(8,"0");
          var pv=parseFloat(String(row[pK]).replace(",","."));
          var found=S.arts.filter(function(a){return a.a===av;})[0];
          if(found&&pv>0){found.pc=Math.round(pv*10000)/10000;updated++;}
        }
      });
      alert("✅ Snapshot guardado!\n"+Object.keys(ns).length+" artigos.\n"+updated+" preços actualizados.");
      S.tab="conf"; re();
    }catch(err){alert("Erro: "+err.message);}
  };
  reader.readAsBinaryString(input.files[0]);
}

      '<td style="font-size:11px">'+r.desc+'</td>'+
      '<td style="font-size:11px;color:#6b7280">'+r.fd+'</td>'+
      '<td>'+eu(r.pA)+'</td><td style="font-weight:600">'+eu(r.pN)+'</td>'+
      '<td><span class="br '+(d>0?"bR":"bG")+'">'+(d>0?"▲":"▼")+Math.abs(d).toFixed(1)+'%</span></td></tr>';
  }).join("");
  return '<div class="card">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
    '<div><div style="font-weight:700;font-size:14px">✅ '+m.length+' artigos identificados</div>'+
    '<div style="font-size:11px;color:#6b7280">Desmarca os que não queres aplicar</div></div>'+
    '<button class="btn bp" onclick="applyF()">Aplicar preços</button></div>'+
    '<div style="overflow-x:auto"><table><thead><tr><th>Incl.</th><th>Artigo</th><th>Descrição EMPRO</th><th>Fornecedor</th><th>Actual</th><th>Novo</th><th>Δ</th></tr></thead>'+
    '<tbody>'+trs+'</tbody></table></div></div>'+
    (u.length>0?'<div class="card"><div style="font-weight:600;font-size:12px;color:#D97706;margin-bottom:10px">⚠️ '+u.length+' não identificados</div>'+
      '<table><thead><tr><th>Designação</th><th>Cód. Barras</th><th>Preço</th></tr></thead><tbody>'+
      u.map(function(r){return '<tr><td>'+r.d+'</td><td><code style="font-size:10px">'+(r.b||"—")+'</code></td><td>'+eu(r.p)+'</td></tr>';}).join("")+
      '</tbody></table></div>':"");
}

function doForn(input){
  if(!input.files[0])return;
  var reader=new FileReader();
  reader.onload=function(e){
    var wb=XLSX.read(e.target.result,{type:"binary"});
    var ws=wb.Sheets[wb.SheetNames[0]];
    var data=XLSX.utils.sheet_to_json(ws,{defval:""});
    if(data.length>0){S.fornH=Object.keys(data[0]);S.fornRaw=data;}
    re();
  };
  reader.readAsBinaryString(input.files[0]);
}

function doMatch(){
  var matched=[],unm=[];
  S.fornRaw.forEach(function(row){
    var b=String(row[S.fColB]||"").trim();
    var d=String(row[S.fColD]||"").toLowerCase().trim();
    var p=parseFloat(String(row[S.fColP]).replace(",","."))||0;
    if(!p)return;
    var found=b?S.arts.filter(function(a){return a.cb===b;})[0]:null;
    if(!found&&d)found=S.arts.filter(function(a){return a.d.toLowerCase().indexOf(d.slice(0,15))>=0||d.indexOf(a.d.toLowerCase().slice(0,15))>=0;})[0];
    if(found)matched.push({art:found.a,desc:found.d,fd:row[S.fColD]||"",pN:p,pA:found.pc,inc:true});
    else unm.push({d:row[S.fColD]||"",b:b,p:p});
  });
  S.matchData=matched;S.unmatch=unm;re();
}
function tM(i){S.matchData[i].inc=!S.matchData[i].inc;re();}
function applyF(){
  S.matchData.filter(function(m){return m.inc;}).forEach(function(m){
    var a=S.arts.filter(function(x){return x.a===m.art;})[0];
    if(a)a.pa=m.pN;
  });
  S.fornOk=true;re();
}

// ── Vendedor ──
function vHTML(){
  var arts=S.arts.filter(function(a){return a.pc>0;});
  var forns=makeForns(arts),marcas=makeMarcas(arts,S.vF),modelos=makeModelos(arts,S.vF,S.vMa);
  var rows=arts.filter(function(a){
    return(!S.srch||a.d.toLowerCase().indexOf(S.srch.toLowerCase())>=0||a.ma.toLowerCase().indexOf(S.srch.toLowerCase())>=0)&&
      (S.vF==="Todos"||a.f===S.vF)&&(S.vMa==="Todas"||a.ma===S.vMa)&&(S.vMo==="Todos"||a.mo===S.vMo);
  });
  var trs=rows.map(function(a){
    var p=pvp(a.pc,a.pa,a.mk);
    return '<tr><td><code style="font-size:10px">'+a.a+'</code></td>'+
      '<td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+a.d+'</td>'+
      '<td>'+(a.ma||"—")+'</td><td style="color:#6b7280">'+(a.mo||"—")+'</td>'+
      '<td style="font-weight:700">'+eu(p)+'</td>'+
      (S.vH?'<td>'+eu(pvpH(p))+'</td>':"")+(S.vG?'<td>'+eu(pvpG(p))+'</td>':"")+
      '</tr>';
  }).join("");
  return '<div class="vbar np">'+
    '<div style="color:#F59E0B;font-weight:700;font-size:17px">EMPRO <span style="color:#4a6080;font-weight:400;font-size:12px">· Tabela de Preços 2026</span></div>'+
    '<div style="display:flex;gap:8px">'+
    '<button class="btn bp" onclick="window.print()">🖨️ Imprimir / PDF</button>'+
    '<button class="btn" onclick="S.role=\'admin\';S.srch=\'\';re()" style="background:#1a2d45;border-color:#1e3050;color:#8899aa">← Admin</button>'+
    '<button class="btn" onclick="S.role=null;S.step=null;re()" style="background:#1a2d45;border-color:#1e3050;color:#8899aa">Sair</button>'+
    '</div></div>'+
    '<div style="padding:16px">'+
    '<div class="card np"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
    '<input type="text" placeholder="🔍 Pesquisar..." value="'+S.srch+'" oninput="S.srch=this.value;re()" style="width:200px">'+
    sel(forns,S.vF,"S.vF=this.value;S.vMa='Todas';S.vMo='Todos';re()")+
    sel(marcas,S.vMa,"S.vMa=this.value;S.vMo='Todos';re()")+
    (modelos.length>1?sel(modelos,S.vMo,"S.vMo=this.value;re()"):"")+
    '<div style="display:flex;gap:12px;margin-left:auto">'+
    '<label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer"><input type="checkbox"'+(S.vH?" checked":"")+ ' onchange="S.vH=!S.vH;re()"> Horeca</label>'+
    '<label style="display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer"><input type="checkbox"'+(S.vG?" checked":"")+ ' onchange="S.vG=!S.vG;re()"> Garrafeira</label>'+
    '</div></div></div>'+
    '<div class="card"><div style="font-size:11px;color:#9ca3af;margin-bottom:10px">'+rows.length+' artigos · Preços com IVA · 2026</div>'+
    '<table><thead><tr><th>Artigo</th><th>Descrição</th><th>Marca</th><th>Modelo</th><th>PVP</th>'+
    (S.vH?"<th>Horeca</th>":"")+(S.vG?"<th>Garrafeira</th>":"")+
    '</tr></thead><tbody>'+trs+'</tbody></table></div></div>';
}

// ── Drag to fill ──
var drag={active:false,art:null,val:null,cls:null};

document.addEventListener("mousedown",function(e){
  var dh=e.target.closest?e.target.closest(".dh"):null;
  if(!dh)return;
  e.preventDefault();
  var row=dh.closest("tr");
  if(!row)return;
  drag.cls=dh.getAttribute("data-cls");
  var art=row.getAttribute(drag.cls==="mk-g"?"data-art-g":"data-art");
  var inp=row.querySelector("."+drag.cls);
  if(!art||!inp)return;
  drag.active=true; drag.art=art; drag.val=parseFloat(inp.value)||0;
  document.getElementById("dragOv").style.display="block";
},true);

document.addEventListener("mousemove",function(e){
  if(!drag.active)return;
  var attr=drag.cls==="mk-g"?"data-art-g":"data-art";
  var rows=document.querySelectorAll("tr["+attr+"]");
  var startRow=null,curRow=null;
  rows.forEach(function(r){
    if(r.getAttribute(attr)===drag.art)startRow=r;
    var rc=r.getBoundingClientRect();
    if(e.clientY>=rc.top&&e.clientY<=rc.bottom)curRow=r;
  });
  rows.forEach(function(r){r.classList.remove("drag-target");});
  if(!startRow||!curRow)return;
  var arr=Array.from(rows);
  var si=arr.indexOf(startRow),ci=arr.indexOf(curRow);
  for(var i=Math.min(si,ci);i<=Math.max(si,ci);i++){ if(i!==si)arr[i].classList.add("drag-target"); }
});

document.addEventListener("mouseup",function(e){
  if(!drag.active)return;
  drag.active=false;
  document.getElementById("dragOv").style.display="none";
  var attr=drag.cls==="mk-g"?"data-art-g":"data-art";
  var rows=document.querySelectorAll("tr["+attr+"]");
  rows.forEach(function(r){
    if(r.classList.contains("drag-target")){
      var art=r.getAttribute(attr);
      var a=S.arts.filter(function(x){return x.a===art;})[0];
      if(a){
        if(drag.cls==="mk-g") a.mk5=Math.round(drag.val/100*10000)/10000;
        else a.mk=Math.round(drag.val/100*10000)/10000;
      }
    }
    r.classList.remove("drag-target");
  });
  re();
},true);

re();
</script>
